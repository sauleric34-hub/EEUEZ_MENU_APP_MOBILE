# ═══════════════════════════════════════════════════════
#  EEUEZ MENU — Configuration Backend
# ═══════════════════════════════════════════════════════

spring.application.name=eeuez-menu-backend
server.port=8888

# ─── BASE DE DONNÉES (H2 — développement) ───────────────
spring.datasource.url=jdbc:h2:file:./data/eeuez;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 accessible sur http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ─── JPA / HIBERNATE ────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── JWT ────────────────────────────────────────────────
# IMPORTANT: Changer cette clé en production !
eeuez.jwt.secret=eeuezMenuSecretKey2024CamerounXYZ!@#$%^&*()SuperLongSecretForJWTHashing
eeuez.jwt.expiration=604800000
# 604800000 ms = 7 jours

# ─── GOOGLE OAUTH (configurer avec vos credentials) ─────
# eeuez.google.client-id=VOTRE_GOOGLE_CLIENT_ID
# eeuez.google.client-secret=VOTRE_GOOGLE_CLIENT_SECRET

# ─── CORS ───────────────────────────────────────────────
# Autorise React Native (toutes origines en dev)
eeuez.cors.allowed-origins=*

# ─── FICHIERS UPLOADÉS ──────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
eeuez.upload.dir=./uploads

# ─── LOGGING ────────────────────────────────────────────
logging.level.com.eeuez.menu=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
