{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titre }}</title>

  {# Aperçu riche dans WhatsApp, Facebook, iMessage… #}
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Menu">
  <meta property="og:title" content="{{ titre }}">
  <meta property="og:description" content="{{ description }}">
  {% if image %}<meta property="og:image" content="{{ image }}">{% endif %}
  <meta name="twitter:card" content="{% if image %}summary_large_image{% else %}summary{% endif %}">

  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b100d; color: #e9efe9; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .carte {
      max-width: 420px; width: 100%; text-align: center;
      background: #141a16; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px; padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    .logo { width: 72px; height: 72px; border-radius: 22px; margin-bottom: 18px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #9aa5a0; font-size: 0.92rem; line-height: 1.55; margin: 0 0 22px; }
    .apercu {
      width: 100%; max-height: 260px; object-fit: cover;
      border-radius: 16px; margin-bottom: 20px;
    }
    .btn {
      display: block; padding: 15px 22px; border-radius: 999px; font-weight: 800;
      text-decoration: none; font-size: 0.95rem; margin-bottom: 10px;
    }
    .btn-primaire { background: linear-gradient(135deg, #F2820B, #E8591C); color: #fff; }
    .btn-secondaire { background: transparent; color: #9aa5a0; border: 1px solid rgba(255,255,255,0.12); }
  </style>
</head>
<body>
  <div class="carte">
    <img class="logo" src="{% static 'logo.png' %}" alt="Menu">
    <h1>{{ titre }}</h1>
    <p>{{ description }}</p>
    {% if image %}<img class="apercu" src="{{ image }}" alt="">{% endif %}

    <a class="btn btn-primaire" href="{{ lien_app }}">Ouvrir dans l'application</a>
    <a class="btn btn-secondaire" href="{% url 'home' %}">Découvrir Menu</a>
  </div>

  <script>
    // Tentative d'ouverture automatique de l'app. Si elle n'est pas installée,
    // rien ne se passe et la page reste affichée avec ses deux boutons — c'est
    // pourquoi on ne redirige PAS vers un magasin d'applications au bout d'un
    // délai : sur navigateur de bureau cela enverrait tout le monde à côté.
    (function () {
      var mobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
      if (mobile) window.location.href = {{ lien_app_json|safe }};
    })();
  </script>
</body>
</html>
