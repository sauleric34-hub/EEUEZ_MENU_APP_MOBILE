{# Rendu d'une bannière, fidèle au composant PromoBanner de l'app (fond,
   image de droite, voile, badge, titre, sous-titre, bouton). Partagé par la
   liste (miniatures) et le formulaire (aperçu en direct). #}
<style>
  .bn-rendu { position: relative; width: 100%; aspect-ratio: 335 / 200; border-radius: 22px; overflow: hidden; background: #1a1a1a;
              font-family: 'Inter', system-ui, sans-serif; container-type: inline-size; isolation: isolate; }
  .bn-fond { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .bn-droite { position: absolute; top: 0; bottom: 0; right: 0; width: 48%; background-size: cover; background-position: center; }
  .bn-voile { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,12,9,.9) 0%, rgba(8,12,9,0) 50%); }
  .bn-badge { position: absolute; top: 8%; left: 5.4%; background: rgba(0,0,0,.4); color: #fff; font-weight: 800; letter-spacing: .5px;
              font-size: 3.1cqw; padding: 1.5cqw 3cqw; border-radius: 999px; white-space: nowrap; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
  .bn-contenu { position: absolute; left: 0; bottom: 0; max-width: 62%; padding: 5.4cqw; }
  .bn-titre { font-size: 6.9cqw; line-height: 1.13; font-weight: 800; white-space: pre-line; word-break: break-word; letter-spacing: -.3px; }
  .bn-sous { font-size: 3.6cqw; font-weight: 600; margin-top: 1.8cqw; opacity: .75; line-height: 1.35; }
  .bn-cta { display: inline-block; margin-top: 3.6cqw; padding: 2.7cqw 4.2cqw; border-radius: 999px; font-size: 3.9cqw; font-weight: 800; }
  .bn-vide { opacity: .45; font-style: italic; }

  /* Animation d'entrée — mêmes directions que dans l'app */
  .bn-rendu.anime .bn-droite { animation: bnDroite .55s cubic-bezier(.2,.9,.3,1) both; }
  .bn-rendu.anime .bn-badge { animation: bnHaut .45s cubic-bezier(.2,1.4,.4,1) .12s both; }
  .bn-rendu.anime .bn-titre { animation: bnGauche .5s cubic-bezier(.2,.9,.3,1) .2s both; }
  .bn-rendu.anime .bn-sous { animation: bnDroiteTxt .5s cubic-bezier(.2,.9,.3,1) .32s both; }
  .bn-rendu.anime .bn-cta { animation: bnBas .5s cubic-bezier(.2,1.3,.4,1) .44s both; }
  @keyframes bnDroite { from { transform: translateX(50%); opacity: 0; } }
  @keyframes bnHaut { from { transform: translateY(-40px); opacity: 0; } }
  @keyframes bnGauche { from { transform: translateX(-60%); opacity: 0; } }
  @keyframes bnDroiteTxt { from { transform: translateX(60%); opacity: 0; } }
  @keyframes bnBas { from { transform: translateY(70px); opacity: 0; } }
</style>
