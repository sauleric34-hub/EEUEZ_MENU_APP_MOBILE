<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Admin — Connexion</title>
{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/base.css' %}">
<link rel="stylesheet" href="{% static 'css/animations.css' %}">
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary); }
.login-bg {
  position: fixed; inset: 0; overflow: hidden; pointer-events: none;
}
.login-bg::before {
  content: '';
  position: absolute;
  top: -40%; left: -20%;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,89,28,0.08) 0%, transparent 70%);
  animation: float 8s ease-in-out infinite;
}
.login-bg::after {
  content: '';
  position: absolute;
  bottom: -30%; right: -10%;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59,130,246,0.06) 0%, transparent 70%);
  animation: float 10s ease-in-out infinite reverse;
}
.login-card {
  width: 100%;
  max-width: 400px;
  padding: 48px 40px;
  background: rgba(17, 17, 24, 0.9);
  border: 1px solid var(--border);
  border-radius: 24px;
  backdrop-filter: blur(20px);
  position: relative;
  z-index: 1;
  animation: fadeInUp 0.6s cubic-bezier(0.4,0,0.2,1) both;
}
.login-logo {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-bottom: 32px;
}
.login-logo img {
  width: 48px; height: 48px;
  border-radius: 14px;
  border: 1px solid var(--border);
}
.login-logo-text h1 {
  font-size: 1.5rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.03em;
}
.login-logo-text p {
  font-size: 0.7rem; color: var(--accent-orange); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
}
.login-title { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
.login-sub { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 28px; }
.form-group { margin-bottom: 18px; }
.input-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.input-icon-wrap { position: relative; }
.input-icon-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--text-muted); }
.input-icon-wrap input {
  width: 100%;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px 11px 40px;
  color: var(--text-primary);
  font-size: 0.9rem;
  outline: none;
  transition: var(--transition);
  font-family: inherit;
}
.input-icon-wrap input:focus {
  border-color: var(--accent-orange);
  box-shadow: 0 0 0 3px rgba(232,89,28,0.12);
}
.input-icon-wrap input::placeholder { color: var(--text-muted); }
.btn-login {
  width: 100%;
  padding: 13px;
  background: var(--accent-orange);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  box-shadow: var(--glow-orange);
  margin-top: 8px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-login:hover { background: #c94a14; transform: translateY(-1px); box-shadow: 0 0 30px rgba(232,89,28,0.5); }
.btn-login:active { transform: translateY(0); }
.error-msg {
  background: var(--accent-red-dim);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--accent-red);
  font-size: 0.8rem;
  margin-bottom: 18px;
  display: flex; align-items: center; gap: 8px;
}
.login-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 0.7rem;
  color: var(--text-muted);
}
</style>
</head>
<body>
<div class="login-bg"></div>

<div class="login-card">
  <div class="login-logo">
    <img src="{% static 'logo.png' %}" alt="Menu" onerror="this.style.display='none'">
    <div class="login-logo-text">
      <h1>Menu</h1>
      <p>Administration</p>
    </div>
  </div>

  <h2 class="login-title">Connexion administrateur</h2>
  <p class="login-sub">Accès réservé au personnel autorisé</p>

  {% if messages %}
    {% for message in messages %}
    <div class="error-msg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ message }}
    </div>
    {% endfor %}
  {% endif %}

  <form method="post" id="loginForm">
    {% csrf_token %}
    <div class="form-group">
      <label class="input-label" for="username">Nom d'utilisateur</label>
      <div class="input-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
        <input type="text" id="username" name="username" placeholder="admin" required autofocus>
      </div>
    </div>
    <div class="form-group">
      <label class="input-label" for="password">Mot de passe</label>
      <div class="input-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="btn-login" id="submitBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Se connecter
    </button>
  </form>

  <div class="login-footer">Menu · Food Fast Easy &copy; 2025</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function() {
  const btn = document.getElementById('submitBtn');
  btn.innerHTML = '<div style="width:18px;height:18px;border:2px solid rgba(0,0,0,0.2);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;"></div> Connexion...';
  btn.disabled = true;
});
</script>
</body>
</html>
