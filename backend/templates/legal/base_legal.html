<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titre %}{% endblock %} — Menu</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; background: #0b100d; color: #e9efe9; padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6;
    }
    main {
      max-width: 760px; margin: 0 auto; background: #141a16;
      border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 32px 24px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 28px 0 8px; color: #f26a1b; }
    .maj { color: #9aa59c; font-size: 0.85rem; margin-bottom: 24px; }
    a { color: #f26a1b; }
    li { margin-bottom: 6px; }
    .encadre { background: rgba(242,106,27,0.08); border: 1px solid rgba(242,106,27,0.3); border-radius: 14px; padding: 14px 16px; }
  </style>
</head>
<body>
  <main>
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
